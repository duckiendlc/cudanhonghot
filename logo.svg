<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Huy hiệu tròn -->
  <circle cx="110" cy="110" r="85" fill="url(#grad)"/>
  <circle cx="110" cy="110" r="85" fill="none" stroke="#0f172a" stroke-width="5"/>

  <!-- Đôi mắt nhòm hóng drama -->
  <g>
    <!-- bức tường phía dưới -->
    <rect x="38" y="138" width="144" height="50" fill="#0f172a"/>
    <rect x="38" y="138" width="144" height="8" fill="#1e293b"/>
    <!-- gạch -->
    <line x1="70" y1="146" x2="70" y2="188" stroke="#1e293b" stroke-width="2"/>
    <line x1="110" y1="146" x2="110" y2="188" stroke="#1e293b" stroke-width="2"/>
    <line x1="150" y1="146" x2="150" y2="188" stroke="#1e293b" stroke-width="2"/>
    <line x1="38" y1="165" x2="182" y2="165" stroke="#1e293b" stroke-width="2"/>

    <!-- mắt trái -->
    <ellipse cx="82" cy="118" rx="22" ry="24" fill="#fff"/>
    <circle cx="86" cy="122" r="11" fill="#0f172a"/>
    <circle cx="89" cy="118" r="3.5" fill="#fff"/>
    <!-- mắt phải -->
    <ellipse cx="138" cy="118" rx="22" ry="24" fill="#fff"/>
    <circle cx="142" cy="122" r="11" fill="#0f172a"/>
    <circle cx="145" cy="118" r="3.5" fill="#fff"/>

    <!-- lông mày kiểu nhướn tò mò -->
    <path d="M62 90 Q82 80 102 88" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <path d="M118 88 Q138 80 158 90" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Dòng 1: CƯ DÂN -->
  <text x="220" y="100" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif" font-size="56" font-weight="900" fill="#0f172a" letter-spacing="1">CƯ DÂN</text>

  <!-- Dòng 2: HÓNG HỚT (gradient) -->
  <text x="220" y="160" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif" font-size="56" font-weight="900" fill="url(#grad)" letter-spacing="1">HÓNG HỚT</text>

  <!-- Tagline -->
  <text x="222" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="3">DRAMA • TIN NÓNG • VIDEO</text>
</svg>
