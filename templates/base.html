<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ site.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">

{# Open Graph - quan trọng cho FB preview #}
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:locale" content="vi_VN">
<meta property="og:title" content="{% block og_title %}{{ site.name }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ site.description }}{% endblock %}">
<meta property="og:url" content="{% block og_url %}{{ site.url }}{% endblock %}">
<meta property="og:image" content="{% block og_image %}{{ site.url }}{{ site.default_og_image }}{% endblock %}">
{% block og_extra %}{% endblock %}

{# Twitter #}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ self.og_title() }}">
<meta name="twitter:description" content="{{ self.og_description() }}">
<meta name="twitter:image" content="{{ self.og_image() }}">

<link rel="canonical" href="{{ self.og_url() }}">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
